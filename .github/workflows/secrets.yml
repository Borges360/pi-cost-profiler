# harness:managed secrets v3 — workspace/templates/workflows/secrets.yml
# Segurança: scan de segredos (gitleaks) no histórico. Sem build, teste funcional ou deploy.
name: secret-scan

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # gitleaks-action lista os commits do PR; sem isso o evento pull_request dá 403

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: gitleaks (GitHub)
        if: ${{ github.server_url == 'https://github.com' }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      # No Gitea a action exige licença (trata o dono como organização); o binário fixado faz o mesmo scan.
      - name: gitleaks (Gitea)
        if: ${{ github.server_url != 'https://github.com' }}
        run: |
          set -eu
          v=8.30.1
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --exit-code 1 .
